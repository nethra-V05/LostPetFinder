<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Pet - LostPetFinder</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>🐾 LostPetFinder</h1>
    <p>Report a Lost Pet</p>
</header>

<main>

    <section class="form-section">

        <h2>Report Lost Pet</h2>

        <form id="lostPetForm">

            <label for="species">Species</label>
            <input
                    type="text"
                    id="species"
                    placeholder="Example: Dog"
                    required
            >


            <label for="breed">Breed</label>
            <input
                    type="text"
                    id="breed"
                    placeholder="Example: Labrador"
                    required
            >


            <label for="colour">Colour</label>
            <input
                    type="text"
                    id="colour"
                    placeholder="Example: Brown"
                    required
            >


            <label for="locality">Last Seen Locality</label>
            <input
                    type="text"
                    id="locality"
                    placeholder="Example: Madurai"
                    required
            >


            <label for="userId">User ID</label>
            <input
                    type="number"
                    id="userId"
                    placeholder="Example: 1"
                    required
            >


            <button type="submit">
                Submit Lost Pet Report
            </button>

        </form>

        <p id="message"></p>

        <br>

        <a href="/">
            ← Back to Home
        </a>

    </section>

</main>

<script src="/js/app.js"></script>

</body>

</html>
